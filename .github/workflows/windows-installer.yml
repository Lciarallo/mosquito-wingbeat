name: Instalar no Arduino - aplicativo Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - windows_installer.py
      - install_arduino.py
      - requirements-windows.txt
      - scripts/build_windows.py
      - tests/test_windows_installer.py
      - firmware/MosquitoSpecies/*.ino
      - firmware/MosquitoSpecies/*.h
      - .gitattributes
      - .github/workflows/windows-installer.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar ferramentas de build
        run: python -m pip install -r requirements-windows.txt
      - name: Verificar instalação e leitura dos resultados
        run: python -m unittest discover -s tests -v
      - name: Gerar executável independente
        run: python scripts/build_windows.py
      - name: Executar o próprio exe e compilar firmware sem placa
        shell: pwsh
        run: |
          $dataFolder = Join-Path $env:RUNNER_TEMP 'Mosquito com espacos'
          $auditFile = Join-Path $env:GITHUB_WORKSPACE 'dist/windows/windows_runtime_audit.json'
          $process = Start-Process -FilePath 'dist/windows/MosquitoWingbeat-Windows.exe' -ArgumentList @('--self-test', $auditFile, '--compile-check', '--data-dir', "`"$dataFolder`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'O executavel falhou no diagnostico Windows.' }
          python scripts/build_windows.py --verify-runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: MosquitoWingbeat-Windows
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
